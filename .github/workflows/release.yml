name: Build & Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find JAR
        id: find_jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version" build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Delete old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 10 --json tagName --jq '.[].tagName' | while read tag; do
            gh release delete "$tag" --yes 2>/dev/null || true
            git push --delete origin "$tag" 2>/dev/null || true
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.find_jar.outputs.jar_path }}" \
            --title "ShulkerPlus ${{ steps.version.outputs.tag }}" \
            --generate-notes
